<!-- File: /var/ossec/etc/ossec.conf snippet -->
<ossec_config>
  <ruleset>
    <!-- Standard decoders and rules -->
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0010-rules_config.xml</rule_exclude>

    <!-- Custom Multi-Stage Alert Fatigue Reduction Ruleset (14 Modules & 7 CDB Lists) -->
    <list>etc/lists/approved-admin-hosts</list>
    <list>etc/lists/approved-maintenance-windows</list>
    <list>etc/lists/approved-vulnerability-scanners</list>
    <list>etc/lists/backup-systems</list>
    <list>etc/lists/critical-assets-list</list>
    <list>etc/lists/monitoring-systems</list>
    <list>etc/lists/service-accounts</list>

    <include>ruleset/rules/001-base-normalization.xml</include>
    <include>ruleset/rules/010-authentication.xml</include>
    <include>ruleset/rules/020-process.xml</include>
    <include>ruleset/rules/030-persistence.xml</include>
    <include>ruleset/rules/040-network.xml</include>
    <include>ruleset/rules/050-malware.xml</include>
    <include>ruleset/rules/060-lateral-movement.xml</include>
    <include>ruleset/rules/061-lateral-correlation.xml</include>
    <include>ruleset/rules/062-lateral-suppression.xml</include>
    <include>ruleset/rules/063-lateral-critical-assets.xml</include>
    <include>ruleset/rules/070-correlation.xml</include>
    <include>ruleset/rules/080-suppression.xml</include>
    <include>ruleset/rules/090-critical-assets.xml</include>
    <include>ruleset/rules/095-governance-log.xml</include>
  </ruleset>
</ossec_config>
