# ==============================================================================
# Fluent Bit Configuration: Wazuh Alert Stream to PostgreSQL Ingestion Pipeline
# Production-Grade • Zero Alert Drop • Level 0+ Ingestion • HA Failover
# ==============================================================================

[SERVICE]
    Flush        2
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf
    Plugins_File plugins.conf

# 1. Inputs: Tail Real-time Wazuh Alerts JSON
[INPUT]
    Name             tail
    Tag              wazuh.alerts
    Path             /var/ossec/logs/alerts/alerts.json
    Parser           json
    DB               /var/log/fluent-bit-wazuh.db
    Mem_Buf_Limit    64MB
    Buffer_Chunk_Size 1MB
    Buffer_Max_Size  10MB
    Skip_Long_Lines  Off
    Refresh_Interval 1

# 2. Outputs: PostgreSQL out_postgre C-Shared Plugin (ASOC 7-Schema Architecture)
[OUTPUT]
    Name                  out_postgre
    Match                 wazuh.alerts
    Uri                   postgres://postgres:postgres@127.0.0.1:5432/wazuh_soc_db?sslmode=disable
    Table                 telemetry.raw_events
    Node_ID               wazuh-node-1
    Node_Priority         100
    Check_Wazuh_Process   true
    Disable_Leader_Election false
    Retry_Limit           10
